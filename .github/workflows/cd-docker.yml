name: CD - Docker Build and Push

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (defaults to git tag)'
        required: false
        type: string
      registry:
        description: 'Docker registry URL'
        required: false
        type: string
        default: 'ghcr.io'

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ github.event.inputs.registry || 'ghcr.io' }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ github.event.inputs.registry || 'ghcr.io' }}/${{ github.repository }}
        tags: |
          type=ref,event=tag
          type=sha,prefix={{branch}}-

    - name: Determine image tag
      id: tag
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.tag }}" ]]; then
          TAG="${{ github.event.inputs.tag }}"
        else
          TAG="${GITHUB_REF#refs/tags/}"
        fi
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "Using tag: $TAG"

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: |
          ${{ github.event.inputs.registry || 'ghcr.io' }}/${{ github.repository }}:${{ steps.tag.outputs.tag }}
          ${{ github.event.inputs.registry || 'ghcr.io' }}/${{ github.repository }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Mock Docker push
      if: always()
      run: |
        echo "🐳 Docker Build Complete"
        echo ""
        echo "📦 Image Details:"
        echo "- Registry: ${{ github.event.inputs.registry || 'ghcr.io' }}"
        echo "- Repository: ${{ github.repository }}"
        echo "- Tags: ${{ steps.tag.outputs.tag }}, latest"
        echo ""
        echo "🔐 To enable actual Docker push:"
        echo "1. Create a Dockerfile in the repository root"
        echo "2. Uncomment the actual push step below"
        echo "3. Ensure proper registry authentication"
        echo ""
        echo "📋 Mock push command that would run:"
        echo "docker push ${{ github.event.inputs.registry || 'ghcr.io' }}/${{ github.repository }}:${{ steps.tag.outputs.tag }}"
        echo "docker push ${{ github.event.inputs.registry || 'ghcr.io' }}/${{ github.repository }}:latest"

    # Uncomment this section to enable actual Docker push
    # - name: Push Docker image
    #   uses: docker/build-push-action@v5
    #   with:
    #     context: .
    #     file: ./Dockerfile
    #     push: true
    #     tags: |
    #       ${{ github.event.inputs.registry || 'ghcr.io' }}/${{ github.repository }}:${{ steps.tag.outputs.tag }}
    #       ${{ github.event.inputs.registry || 'ghcr.io' }}/${{ github.repository }}:latest
    #     cache-from: type=gha
    #     cache-to: type=gha,mode=max

    - name: Create deployment summary
      if: always()
      run: |
        echo "## 🚀 CD Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Docker Image" >> $GITHUB_STEP_SUMMARY
        echo "- **Registry**: ${{ github.event.inputs.registry || 'ghcr.io' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Repository**: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Tags**: ${{ steps.tag.outputs.tag }}, latest" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔧 Build Info" >> $GITHUB_STEP_SUMMARY
        echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Runner**: ${{ runner.os }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "To enable actual Docker push:" >> $GITHUB_STEP_SUMMARY
        echo "1. Create a Dockerfile" >> $GITHUB_STEP_SUMMARY
        echo "2. Uncomment the push step in workflow" >> $GITHUB_STEP_SUMMARY
        echo "3. Configure registry authentication" >> $GITHUB_STEP_SUMMARY