[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "project_name"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Artem Pereverzev" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "loguru>=0.7.3",
    "matplotlib>=3.10.6",
    "mkdocs",
    "nbformat>=5.10.4",
    "numpy>=2.3.3",
    "pandas>=2.3.3",
    "pip",
    "plotly>=6.3.1",
    "pydantic>=2.11.9",
    "pypdf2>=3.0.1",
    "pytest",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "reportlab>=4.4.4",
    "ruff",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["project_name"]
include = ["pyproject.toml", "project_name/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["project_name"]
force-sort-within-sections = true

